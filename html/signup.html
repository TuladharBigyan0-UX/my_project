<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Signup Form</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/signup_style.css">
<link rel="stylesheet" href="../css/responsive.css">

</head>

<body>

<a href="../index.html" class="back-btn">← Back to Home</a>

<div class="signup-container">

<div class="icon">
<img src="../images/logo.png" alt="logo" height="80">
</div>

<h2>Create Account</h2>
<p>Join our library management system</p>

<form id="signupForm" action="../php/signup.php" method="POST">

<!-- Full Name -->
<div class="form-group">
<label>Full Name *</label>
<input type="text" id="fullname" name="fullname" placeholder="Your Full Name" required>
<small id="nameError" style="color:red;"></small>
</div>

<!-- Email -->
<div class="form-group">
<label>Email Address *</label>
<input type="email" id="email" name="email" placeholder="Your Email" required>
<small id="emailError" style="color:red;"></small>
</div>

<!-- Password -->
<div class="form-group">
<label>Password *</label>
<div class="password-wrapper">
<input type="password" name="password" id="password" placeholder="********" required>
<button type="button" class="toggle-btn" data-target="password">Show</button>
</div>
<small id="passwordError" style="color:red;"></small>
</div>

<!-- Confirm Password -->
<div class="form-group">
<label>Confirm Password *</label>
<div class="password-wrapper">
<input type="password" name="confirm_password" id="confirm_password" placeholder="********" required>
<button type="button" class="toggle-btn" data-target="confirm_password">Show</button>
</div>
<small id="confirmPasswordError" style="color:red;"></small>
</div>

<!-- Contact Number -->
<div class="form-group">
<label>Contact Number</label>
<input type="text" name="contact" pattern="^9[6-8][0-9]{8}$" placeholder="9*********" maxlength="10" required>
<small id="contactError" style="color:red;"></small>
</div>

<!-- Address -->
<div class="form-group">
<label>Address</label>
<input type="text" id="address" name="address" placeholder="Enter your address">
<small id="addressError" style="color:red;"></small>
</div>

<!-- Signup Button -->
<button type="submit" class="submit-btn">Sign Up</button>

<div class="signin-link">
Already have an account? <a href="../php/login.php">Login</a>
</div>

</form>
</div>

<script src="../js/password_validation.js"></script>
<script src="../js/mobile_menu.js"></script>

<script>

document.getElementById("signupForm").addEventListener("submit", function(e){

let fullname = document.getElementById("fullname").value;
let email = document.getElementById("email").value;
let address = document.getElementById("address").value;

let nameError = document.getElementById("nameError");
let emailError = document.getElementById("emailError");
let addressError = document.getElementById("addressError");

nameError.textContent = "";
emailError.textContent = "";
addressError.textContent = "";

let numberPattern = /\d/;
let valid = true;

/* Full Name validation */
if(numberPattern.test(fullname)){
nameError.textContent = "Full name cannot contain numbers";
valid = false;
}

/* Email validation */
let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailPattern.test(email)){
    emailError.textContent = "Enter a valid email address";
    valid = false;
}

/* Address validation */
if(numberPattern.test(address)){
addressError.textContent = "Address cannot contain numbers";
valid = false;
}

if(!valid){
e.preventDefault();
}

});

</script>
</body>
</html>
